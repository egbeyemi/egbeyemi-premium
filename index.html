<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Egbeyemi Premium</title>

<body>

<div class="overlay">

<h1>Egbeyemi Premium</h1>

<p>Affordable Spotify Premium Slots</p>

<!-- REGISTER SECTION -->

<div id="register">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Enter your name">

<input type="text" id="whatsapp" placeholder="Enter your WhatsApp number">

<button onclick="createAccount()">Create Account</button>

</div>

<!-- DASHBOARD -->

<div id="dashboard" style="display:none;">

<h2>Welcome 🎧</h2>

<p>You can now activate Spotify Premium</p>

<button onclick="openForm()">Activate Spotify Premium</button>

</div>

<!-- ORDER FORM -->

<div id="formSection" style="display:none; margin-top:20px;">

<input type="text" id="username" placeholder="Spotify Username">

<select id="plan">

<option value="1 Month — ₦700">1 Month — ₦700</option>

<option value="3 Months — ₦2000">3 Months — ₦2000</option>

<option value="6 Months — ₦3500">6 Months — ₦3500</option>

</select>

<button onclick="orderPremium()">Proceed to Payment</button>

</div>

<p style="margin-top:30px;font-size:14px;">
Need help? Contact support
</p>

<a href="https://wa.me/2349139103648">

<button style="background:#25D366;">Chat Support</button>

</a>

</div>

</div>

<script src="script.js"></script>

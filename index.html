<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Egbeyemi Premium</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay">

<div class="container">

<h1>Egbeyemi Premium</h1>

<!-- REGISTER -->

<div id="register">

<h2>Create Account</h2>

<input id="name" placeholder="Your Name">
<input id="whatsapp" placeholder="WhatsApp Number">

<button onclick="createAccount()">Create Account</button>

</div>

<!-- OFFER PAGE -->

<div id="offer" style="display:none">

<h2>Enjoy Spotify Premium</h2>

<p>Join a Spotify Premium family plan instantly.</p>

<h3 class="price">₦600 / month</h3>

<button onclick="startEnjoying()">Start Enjoying</button>

</div>

<!-- AUTORENEWAL -->

<div id="renewal" style="display:none">

<h2>Activate Autorenewal?</h2>

<p>Automatically renew subscription when it expires.</p>

<label class="switch">
<input type="checkbox" id="autoRenew">
<span class="slider"></span>
</label>

<br><br>

<button onclick="continuePayment()">Continue</button>

</div>

<!-- PAYMENT SUMMARY -->

<div id="payment" style="display:none">

<h2>Almost There!</h2>

<p>Spotify Premium</p>

<p>Subscription Fee: ₦600</p>

<p>VAT (18%): ₦108</p>

<h3>Total: ₦708</h3>

<button onclick="proceedPayment()">Proceed to Payment</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

  </html>
